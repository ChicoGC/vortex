<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>vortex</title>
<meta name="description" content="vortex — see what your friends are listening to, in real time.">
<meta name="color-scheme" content="dark light">

<!-- Handshakes start now instead of when the first request needs them. -->
<link rel="preconnect" href="https://hpblrmnturpihyrhwzih.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Fonts don't hold up the first paint: system type shows until Geist arrives (display=swap). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..500&display=swap" media="print" data-async-css>
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..500&display=swap"></noscript>

<!-- The saved theme before the first paint (so light mode doesn't flash dark), and the fonts switched on. -->
<script src="js/early.js"></script>

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/scenes.css">
<link rel="stylesheet" href="css/mural.css">

<link rel="icon" type="image/png" sizes="64x64" href="assets/logo-64.png">
<link rel="apple-touch-icon" href="assets/logo-256.png">

<!-- defer: everything downloads in parallel with the page and runs in this order once it's parsed.
     Supabase is pinned to an exact version so browsers can cache it for a year, and integrity makes
     the browser refuse it if the CDN ever serves anything else. Upgrading means a new hash:
     curl -s <url> | openssl dgst -sha384 -binary | openssl base64 -A -->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<script defer src="js/config.js"></script>
<script defer src="js/i18n.js"></script>
<script defer src="js/i18n-pt.js"></script>
<script defer src="js/db.js"></script>
<script defer src="js/spotify.js"></script>
<script defer src="js/icons.js"></script>
<script defer src="js/data.js"></script>
<script defer src="js/views.js"></script>
<script defer src="js/dna.js"></script>
<script defer src="js/dna-views.js"></script>
<script defer src="js/social-views.js"></script>
<script defer src="js/recap.js"></script>
<script defer src="js/sounds.js"></script>
<script defer src="js/clips.js"></script>
<script defer src="js/mural.js"></script>
<script defer src="js/custom-views.js"></script>
<script defer src="js/auth-views.js"></script>
<script defer src="js/app.js"></script>
</head>
<body>

<div class="ambient" id="ambient" aria-hidden="true"><i></i><i></i><i></i><i></i>
  <div class="scene" id="scene"><span></span><span></span><span></span></div></div>

<!-- Starts bare (no sidebar or tab bar) with the logo showing; the first setView fills it in. -->
<div class="app" id="app" data-rail="full" data-authed="false">
  <aside class="sidebar panel" id="sidebar" hidden></aside>
  <main class="main">
    <div class="mobile-bar" id="mobilebar" hidden></div>
    <div id="viewRoot" style="display:contents"><div class="boot" role="status"><img src="assets/logo-64.png" width="44" height="44" alt="vortex"></div></div>
  </main>
</div>

<div class="bottomnav" id="bottomnav" hidden></div>

<div class="toast-stack" id="toasts" aria-live="polite"></div>
<div id="overlay" hidden></div>

</body>
</html>
